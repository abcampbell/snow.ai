async function go(e){e.preventDefault();const pw=document.getElementById('pw').value;

const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(SALT),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
