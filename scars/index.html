:root{--bg:#0b0e14;--panel:#141a24;--line:#232c3a;--text:#e6ebf2;--muted:#8a97a8;--amber:#f0b429;--red:#ef4444;--blue:#60a5fa}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.scar{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;padding:13px 15px;margin-bottom:10px}
.scar .h{color:var(--amber);font-size:14px;font-weight:600}
.scar .date{color:var(--muted);font-size:13px;font-weight:400}
.scar .claim{margin-top:5px}

.scar .rule{color:var(--blue);font-size:13px;margin-top:6px}
.scar .src{color:var(--muted);font-size:12px;margin-top:5px}
.lock-panel{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9999;padding:24px}
.lock-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px}
.lock-card h2{margin:0 0 8px}.lock-card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.lock-form{display:flex;gap:8px}.lock-form input{flex:1}.lock-form button{border:1px solid var(--amber);background:var(--amber);color:#0b0e14;border-radius:6px;font-weight:700;cursor:pointer;padding:0 18px}
.lock-error{min-height:18px;margin-top:10px;color:var(--red);font-size:13px}
body.locked header,body.locked .wrap{display:none}

function b64(v){const b=atob(v);const o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
async function decrypt(pw){
  const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:SECURE_PAYLOAD.hash,salt:b64(SECURE_PAYLOAD.salt),iterations:SECURE_PAYLOAD.iterations},m,{name:"AES-GCM",length:256},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(SECURE_PAYLOAD.iv)},k,b64(SECURE_PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(p));
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
// tiny markdown -> html (headers, bold, bullets)
function md2html(md){
  let h=esc(md);
  h=h.replace(/^#{1,6}\s*(.+)$/gm,"<h2>$1</h2>");
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/^\-\s+(.+)$/gm,"&bull; $1<br>");
  h=h.replace(/\n{2,}/g,"<br><br>");
  return h;
}
let DATA=null;
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const L=document.getElementById("list");L.innerHTML="";let n=0;
  for(const s of DATA.scars){
    const blob=(s.instrument+" "+s.claim+" "+s.actual+" "+s.rule).toLowerCase();
    if(q&&!blob.includes(q))continue;n++;
    L.insertAdjacentHTML("beforeend",
      `<div class="scar"><div class="h">${esc(s.instrument)} <span class="date">[${esc(s.date)}]${s.conf?' &middot; "'+esc(s.conf)+'"':''}</span></div>
      <div class="claim">${esc(s.claim)}</div>
      <div class="actual"><b>actual:</b> ${esc(s.actual)}${s.obs_date?' ('+esc(s.obs_date)+')':''}</div>
      ${s.post_mortem?`<div class="pm">${esc(s.post_mortem)}</div>`:""}
      ${s.rule&&s.rule.toLowerCase()!=="none"?`<div class="rule">&rarr; rule: ${esc(s.rule)}</div>`:""}
      ${s.src?`<div class="src">src: ${esc(s.src)}</div>`:""}</div>`);
  }
  document.getElementById("count").textContent=`${n} of ${DATA.count} scars`;
}
(function(){const form=document.getElementById("lockForm"),inp=document.getElementById("lockPassword"),err=document.getElementById("lockError");inp.focus();
form.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";
 try{DATA=await decrypt(inp.value);document.body.classList.remove("locked");document.getElementById("lockPanel").remove();
   document.getElementById("themes").innerHTML=md2html(DATA.standing_rules_md);
   document.getElementById("q").addEventListener("input",render);render();}
 catch(x){err.textContent="Could not decrypt. Check the password.";inp.select();}});})();
