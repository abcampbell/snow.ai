function b64bytes(v){const b=atob(v),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64bytes(SECURE_PAYLOAD.salt),iterations:SECURE_PAYLOAD.iterations,hash:SECURE_PAYLOAD.hash},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(SECURE_PAYLOAD.iv)},key,b64bytes(SECURE_PAYLOAD.data));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async(ev)=>{

  const e=document.getElementById('e');e.textContent='decrypting…';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(err){e.textContent='wrong passphrase';}
});
